<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 16px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .password-wrap { position: relative; }

    .toggle {
      position: absolute;
      left: 10px;
      top: 9px;
      background: none;
      border: none;
      color: #4f46e5;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }

    .row label { margin: 0; display: flex; align-items: center; gap: 6px; }
    .row a { color: #4f46e5; text-decoration: none; }
    .row a:hover { text-decoration: underline; }

    button.submit {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.submit:hover { background: #4338ca; }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .message.error { color: #dc2626; }
    .message.success { color: #16a34a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>مرحباً بعودتك</h1>
    <p class="subtitle">سجّل الدخول للمتابعة</p>

    <form id="loginForm" novalidate>
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@mail.com" autocomplete="email" required>

      <label for="password">كلمة المرور</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle">إظهار</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="remember"> تذكرني</label>
        <a href="#">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="submit">تسجيل الدخول</button>
      <p class="message" id="message" role="alert"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle");
    const message = document.getElementById("message");

    toggle.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "إخفاء" : "إظهار";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      message.className = "message";

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      if (!emailOk) {
        message.textContent = "يرجى إدخال بريد إلكتروني صحيح.";
        message.classList.add("error");
        return;
      }
      if (password.value.length < 6) {
        message.textContent = "كلمة المرور يجب ألا تقل عن 6 أحرف.";
        message.classList.add("error");
        return;
      }

      // هذه واجهة فقط: اربطها بالخادم (API) هنا لتنفيذ تسجيل الدخول فعلياً
      message.textContent = "تم التحقق من البيانات بنجاح ✔";
      message.classList.add("success");
    });
  </script>
</body>
</html>
